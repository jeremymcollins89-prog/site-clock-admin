name: Build Mac app

# Whenever "npm run release" creates/updates the GitHub Release for a new
# Windows build, this automatically builds the Mac version (dmg + zip) on
# GitHub's own Mac servers and attaches it to that same release -- so
# there's never a manual "now go build the Mac version too" step.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Mac app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish always
